<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 热点论坛 - 自动播报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; font-size: 1.1em; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; color: #00d9ff; }
        .stat-label { color: #666; font-size: 0.9em; }
        
        .posts { display: flex; flex-direction: column; gap: 20px; }
        .post {
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
        }
        .post:hover {
            background: rgba(255,255,255,0.08);
            border-color: #00d9ff;
            transform: translateX(5px);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .post-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #fff;
        }
        .post-meta {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .post-time { color: #666; font-size: 0.9em; }
        .tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag {
            background: linear-gradient(90deg, #00d9ff22, #00ff8822);
            color: #00d9ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            border: 1px solid #00d9ff44;
        }
        .tag.ai { background: #ff6b6b22; color: #ff6b6b; border-color: #ff6b6b44; }
        .tag.tech { background: #4ecdc422; color: #4ecdc4; border-color: #4ecdc444; }
        .tag.business { background: #ffe66d22; color: #ffe66d; border-color: #ffe66d44; }
        .post-content { color: #ccc; line-height: 1.6; margin-bottom: 15px; }
        .post-link {
            display: inline-block;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            padding: 8px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        .post-link:hover { opacity: 0.8; }
        .post-score {
            background: #ff6b6b22;
            color: #ff6b6b;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty h3 { margin-bottom: 10px; color: #888; }
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,217,255,0.3);
            transition: transform 0.3s;
        }
        .refresh-btn:hover { transform: scale(1.05); }
        .auto-refresh {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI 热点论坛</h1>
            <p class="subtitle">自动收集 · 实时更新 · 热点播报</p>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="totalPosts">0</div>
                    <div class="stat-label">总帖子数</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="todayPosts">0</div>
                    <div class="stat-label">今日更新</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="lastUpdate">--:--</div>
                    <div class="stat-label">最后更新</div>
                </div>
            </div>
        </header>
        
        <main class="posts" id="postsContainer">
            <div class="empty">
                <h3>🌱 等待第一篇帖子...</h3>
                <p>每小时整点自动收集 AI 界热点</p>
            </div>
        </main>
    </div>
    
    <button class="refresh-btn" onclick="loadPosts()">🔄 刷新</button>
    <div class="auto-refresh">自动刷新：<span id="countdown">60</span>s</div>
    
    <script>
        let autoRefreshInterval;
        let countdown = 60;
        
        function loadPosts() {
            fetch('data.json?t=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    renderPosts(data);
                    updateStats(data);
                })
                .catch(e => console.error('加载失败:', e));
        }
        
        function renderPosts(data) {
            const container = document.getElementById('postsContainer');
            const posts = data.posts || [];
            
            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <h3>🌱 等待第一篇帖子...</h3>
                        <p>每小时整点自动收集 AI 界热点</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = posts.map((post, index) => `
                <article class="post" style="animation-delay: ${index * 0.1}s">
                    <div class="post-header">
                        <h2 class="post-title">${escapeHtml(post.title)}</h2>
                        <div class="post-meta">
                            ${post.score ? `<span class="post-score">🔥 ${post.score}分</span>` : ''}
                            <span class="post-time">📅 ${formatTime(post.timestamp)}</span>
                        </div>
                    </div>
                    <div class="tags">
                        ${(post.tags || []).map(tag => `<span class="tag ${tag.toLowerCase()}">${tag}</span>`).join('')}
                    </div>
                    <p class="post-content">${escapeHtml(post.content || '')}</p>
                    ${post.url ? `<a href="${post.url}" target="_blank" class="post-link">🔗 阅读原文</a>` : ''}
                </article>
            `).join('');
        }
        
        function updateStats(data) {
            document.getElementById('totalPosts').textContent = (data.posts || []).length;
            
            const today = new Date().toDateString();
            const todayPosts = (data.posts || []).filter(p => 
                new Date(p.timestamp).toDateString() === today
            ).length;
            document.getElementById('todayPosts').textContent = todayPosts;
            
            if (data.lastUpdated) {
                const last = new Date(data.lastUpdated);
                document.getElementById('lastUpdate').textContent = 
                    last.toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'});
            }
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function startAutoRefresh() {
            countdown = 60;
            document.getElementById('countdown').textContent = countdown;
            
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            
            autoRefreshInterval = setInterval(() => {
                countdown--;
                document.getElementById('countdown').textContent = countdown;
                
                if (countdown <= 0) {
                    loadPosts();
                    countdown = 60;
                }
            }, 1000);
        }
        
        // 初始加载
        loadPosts();
        startAutoRefresh();
    </script>
</body>
</html>
