<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 热点论坛 - 自动播报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --text-primary: #e0e0e0;
            --text-secondary: #cccccc;
            --border-color: #333333;
            --accent-1: #00d9ff;
            --accent-2: #00ff88;
            --danger: #ff6b6b;
            --warning: #ffe66d;
            --card-bg: rgba(255,255,255,0.05);
            --card-bg-hover: rgba(255,255,255,0.08);
            transition: all 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%;
            min-height: 100vh;
            color: var(--text-primary);
            padding-bottom: 120px;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px 15px; 
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: var(--text-secondary); font-size: 1.1em; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat { text-align: center; padding: 5px; }
        .stat-value { 
            font-size: 2em; 
            font-weight: bold; 
            color: var(--accent-1); 
        }
        .stat-label { color: var(--text-secondary); font-size: 0.9em; }
        
        .posts { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes postFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 15px;
            transition: all 0.3s ease;
            animation: postFadeIn 0.5s ease forwards;
            animation-delay: calc(var(--animation-index) var(--post-delay));
            --animation-index: calc(var(--i) * 0.1s);
            opacity: 0;
            transform: translateY(10px);
        }
        .post:hover {
            background: var(--card-bg-hover);
            border-color: var(--accent-1);
            transform: translateX(3px);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .post-title {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }
        .post-meta {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .post-time { color: var(--text-secondary); font-size: 0.9em; }
        .tags { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .tag {
            background: linear-gradient(90deg, var(--accent-1) 20%, var(--accent-2) 100%;
            background-opacity: 0.2;
            color: var(--accent-1);
            padding: 4px 12px;
            border: 1px solid var(--accent-1);
            border-radius: 20px;
            opacity: 0.8;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag:hover { opacity: 1; }
        .tag.ai { background: rgba(255, 107, 108, 0.2); color: #ff6b6b; border-color: #ff6b6b44; }
        .tag.tech { background: rgba(78, 205, 196, 0.2); color: #4ecdac; border-color: #4ecdac; }
        .tag.business { background: rgba(255, 230, 109, 0.2); color: #4ecdac; border-color: #4ecdac; }
        .post-content { color: var(--text-secondary); line-height: 1.6; margin-bottom: 15px; }
        .post-link {
            display: inline-block;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2);
            color: var(--bg-gradient-start);
            padding: 8px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        .post-link:hover { opacity: 0.8; }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        empty h3 { margin-bottom: 10px; color: var(--text-secondary); }

        /* 搜索过滤 */
        .search-bar {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            outline: none;
        }
        .filter-btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--accent-1);
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            color: var(--bg-gradient-start);
            font-weight: 600;
        }
        .filter-btn.clear {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
        }
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-btn.active {
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2);
            color: var(--bg-gradient-start);
            font-weight: bold;
        }
        /* 主题切换按钮 */
        .bottom-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .auto-refresh {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--card-bg);
            border-radius: 25px;
        }
    </style>
</head>

        <div class="pagination" id="pagination"></div>
    </div>
