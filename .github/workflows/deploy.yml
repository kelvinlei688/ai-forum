name: Deploy AI Forum to GitHub Pages

on:
  # 每小时 13 分自动运行（北京时间）
  schedule:
    - cron: '13 * * * *'  # 每小时 13 分 (UTC+8 = 北京时间)
  
  # push 到 main 分支自动部署
  push:
    branches:
      - main
  
  # 允许手动触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: write
  pages: write
  id-token: write

# 取消正在运行的旧任务
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Collect AI News
        run: |
          chmod +x publish.sh
          echo "📝 当前目录：$(pwd)"
          echo "📋 文件列表:"
          ls -la
          echo "🔧 执行 publish.sh..."
          bash publish.sh
          echo "✅ 数据文件内容:"
          cat data.json | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
