name: Deploy AI Forum to GitHub Pages

on:
  # 每小时 5 分自动运行
  schedule:
    - cron: '5 * * * *'  # 每小时 5 分 (UTC)
  
  # 允许手动触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: write
  pages: write
  id-token: write

# 取消正在运行的旧任务
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Collect AI News
        run: |
          chmod +x forum/publish.sh
          cd forum
          bash publish.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './forum'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
